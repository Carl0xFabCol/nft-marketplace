[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"


fs_permissions = [
    { access = "read-write", path = "./deployments" }
]

# Optimizer settings for contract size reduction
optimizer = true
optimizer_runs = 200

# I-02: via-IR causes a solc 0.8.24 Yul stack limit in MarketplaceCore.
# LaunchPad/InvariantsS3 stack pressure is resolved by small refactors instead.
via_ir = false

# OZ Contracts 5.5.0 uses MCOPY in utils/Bytes.sol, so Cancun is required.
evm_version = "cancun"

[profile.production]
optimizer = true
optimizer_runs = 1000000  # Optimize for gas efficiency in production

[rpc_endpoints]
sepolia = "https://ethereum-sepolia-rpc.publicnode.com"
elysium = "https://testnet-rpc.elysium.kinetiq.xyz"

[invariant]
runs = 256
depth = 50
fail_on_revert = false
