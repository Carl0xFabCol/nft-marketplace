[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"

# Optimizer settings for contract size reduction
optimizer = true
optimizer_runs = 200

# Enable via-ir to solve "Stack too deep" errors
via_ir = true

# Optional: Additional settings
# evm_version = "paris"

[profile.production]
optimizer = true
optimizer_runs = 1000000  # Optimize for gas efficiency in production

[rpc_endpoints]
sepolia = "https://ethereum-sepolia-rpc.publicnode.com"
