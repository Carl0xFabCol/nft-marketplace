name: CI

# Phase 0 safety net. No secrets, no deployments, no live-chain or Supabase
# access: forge tests run on the in-process EVM and TS tests mock all I/O.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contracts (forge build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/contracts/foundry
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: forge build
        run: forge build

      - name: forge test
        run: forge test

      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      # Test #5: committed src/abis/*.generated.ts must be byte-identical to a
      # fresh regeneration from the artifacts built above.
      - name: Generated ABIs are up to date
        working-directory: .
        run: pnpm --filter @marketplace/contracts generate:abis:check

  typescript:
    name: TypeScript (typecheck + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm turbo run test

      # Every package with a typecheck script, including apps/indexer and
      # @marketplace/database (both made green in Phase 3A).
      - name: Typecheck
        run: pnpm turbo run typecheck

  integration-contract-tests:
    name: Integration contract tests
    runs-on: ubuntu-latest
    # Blocking since Phase 4: every audit defect these checks encoded is fixed
    # (see "Known-failing tests" in docs/PRODUCTION_PLAN.md). Do not weaken a
    # check to turn this green; fix the code it points at.
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Tests #7 + #8 and checks (a)(b)(c)(f). (d) is live-RPC only: no --live here.
      - name: validate:integration
        run: pnpm validate:integration --chain-id 99801