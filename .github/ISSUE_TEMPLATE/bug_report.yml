name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please fill out the information below.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug
      placeholder: "e.g., When I list an NFT, the price shows as 0 in the UI after confirmation"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the codebase is affected?
      multiple: false
      options:
        - frontend
        - indexer
        - contracts
        - shared packages
        - deployment
        - other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      render: bash
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        Browser (if frontend)
        Network (e.g. Sepolia, mainnet)
        Node.js version
        Any other relevant info
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs / Errors
      description: Relevant error messages, transaction hashes, or log output
      render: bash
    validations:
      required: false
