name: Feature Request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Got an idea for a new feature or improvement? Let us know!
  - type: input
    id: title
    attributes:
      label: Feature Title
      placeholder: "e.g., Add support for ERC-1155 collections"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Explain the feature and why it would be useful
      placeholder: |
        What problem does this solve? What's the user benefit?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: false
      options:
        - frontend
        - indexer
        - contracts
        - shared packages
        - deployment
        - docs
        - other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What workarounds or alternatives have you tried?
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Mockups
      description: If applicable, add screenshots or mockups to explain your request
    validations:
      required: false